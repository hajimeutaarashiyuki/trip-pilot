<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f0">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121416">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip Pilot">
<title>Trip Pilot</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<style>
  :root {
    --bg: #f7f5f0; --bg-elevated: #ffffff; --fg: #1d1d1b; --muted: #6b6a66;
    --accent: #2f6f5e; --accent-fg: #ffffff; --warn: #9a6a12; --warn-bg: #fff4d6; --line: #e3e0d8;
    --rest: #e9f2ee; --gutter: 16px; --tabs: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121416; --bg-elevated: #1c1f22; --fg: #ece9e2; --muted: #9a9890;
      --accent: #7fc1ad; --accent-fg: #0f1a16; --warn: #e0a94a; --warn-bg: #2a2416; --line: #2a2e32; --rest: #182420;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    padding: max(var(--gutter), env(safe-area-inset-top)) max(var(--gutter), env(safe-area-inset-right)) calc(var(--tabs) + max(var(--gutter), env(safe-area-inset-bottom))) max(var(--gutter), env(safe-area-inset-left));
    overflow-x: hidden;
  }
  #app { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  h2 { font-size: 19px; margin: 0; }
  h3 { font-size: 18px; margin: 4px 0; }
  p { margin: 4px 0; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .version { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs) + env(safe-area-inset-bottom)); text-align: center; font-size: 11px; opacity: .6; pointer-events: none; }

  .btn { font: inherit; font-size: 15px; line-height: 1.5; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--accent); background: transparent; color: var(--accent); }
  .btn.primary { background: var(--accent); color: var(--accent-fg); }
  .btn.quiet { border-color: var(--line); color: var(--muted); }
  .btn.quiet.on { border-color: var(--accent); color: var(--accent); }
  .btn.alt { display: block; width: 100%; text-align: left; margin-top: 6px; border-color: var(--line); color: var(--fg); background: var(--bg-elevated); }
  .btn.huge { width: 100%; font-size: 20px; padding: 16px; margin: 12px 0; }
  .btn.wide { display: block; width: 100%; }
  .btn.star { padding: 10px 8px; }
  a.btn { display: inline-block; text-decoration: none; text-align: center; vertical-align: middle; }
  .hidden-input { display: none; }
  /* 復原列貼在視窗頂端：「升級成站」「不去了」的鍵在長頁深處（8/17 捲到 13,000px），列在頁首會看不到（10-16 審查） */
  .undo-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--rest); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; margin: 8px 0 12px; font-size: 14px; }
  .undo-bar .btn { white-space: nowrap; flex: none; }
  .undo-bar.notice { background: var(--bg-elevated); }   /* 二選一／順延後的一句（T16）：同一種 sticky 列，底色淡一階跟復原列分開 */
  /* 二選一（T16）：店名下一行「或 [B]」，B 是小鍵、旁邊一句來源；排不進清單每條尾巴一顆「排到別天」 */
  .btn.sm { padding: 6px 10px; font-size: 14px; }
  .choice { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 4px; }
  .dropped li { margin: 4px 0; }
  .dropped li .btn { margin-left: 6px; vertical-align: middle; }
  .status { margin-top: 8px; }
  .edits .btn { margin-left: 8px; vertical-align: middle; }   /* 設定頁「本機改動：N 天有改」行尾的「還原成打包版」（T16b） */
  .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .row.top { margin-bottom: 8px; }
  .row.sim { justify-content: flex-start; margin: 8px 0; flex-wrap: wrap; }

  .day { margin: 18px 0 8px; }
  .day-head { padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .card { background: var(--bg-elevated); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .card.anchor { border-color: var(--accent); }
  .card.rest { background: var(--rest); }
  .card.big { padding: 18px 16px; }
  .card.next h2 { font-size: 26px; margin: 2px 0 6px; }
  .card.warn { background: var(--warn-bg); border-color: var(--warn); }
  .warn-line { color: var(--warn); font-weight: 600; }
  .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .time.big { font-size: 22px; color: var(--fg); margin-right: 8px; }
  .big-line { font-size: 19px; font-weight: 600; }
  .cat { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .cat.item { color: var(--accent); border-color: var(--accent); margin-right: 6px; }
  .leg { margin: 6px 0 0; }
  .leg a { white-space: nowrap; display: inline-block; color: var(--accent); text-decoration: none; margin-left: 8px; padding: 4px 6px; }
  /* 走廊清單（T15）：移動那行旁一顆小鍵「經過 N 家」；長段（leg-suggest）改成整行提示鍵——提示不是警告，用主色、虛線框，不用黃字 */
  .leg-block { margin: 6px 0 0; }
  .leg-block .leg { margin: 0; }
  .btn.tiny { font-size: 13px; padding: 4px 10px; border-radius: 999px; margin-left: 4px; vertical-align: middle; }
  .btn.leg-hint { display: block; width: 100%; text-align: left; margin-top: 6px; font-size: 14px; padding: 6px 10px; border-radius: 10px; border: 1px dashed var(--accent); color: var(--accent); background: transparent; white-space: normal; }
  .btn.leg-hint.on, .btn.tiny.on, .btn.text.on { background: var(--rest); }   /* 開著的鍵都用同一種底色（現場頁的文字鍵之前沒有開著的樣子，10-16 審查） */
  .corridor-list { margin: 6px 0 0; padding: 4px 10px 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  .corridor-item { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; padding: 8px 0 6px; border-top: 1px solid var(--line); }
  .corridor-item .name { flex: 1 1 100%; min-width: 0; }
  .corridor-item.visited .name strong::after { content: ' ✓'; color: var(--accent); }
  .corridor-item .actions { flex: 1 1 100%; margin-top: 4px; }
  .corridor-item .actions .btn { padding: 4px 10px; font-size: 14px; }
  .btn.text { border: 0; padding: 6px 8px; margin-left: -8px; border-radius: 8px; font-size: 14px; color: var(--accent); text-align: left; background: transparent; }   /* 現場頁單手按：文字鍵也要有 30px 左右的高度（10-16 實測 0 padding 只有 21px）；負邊距讓文字跟卡上其他行對齊 */
  .corridor-now { margin: 2px 0; }
  .warn-list { margin: 6px 0 0; padding-left: 18px; color: var(--warn); font-size: 14px; }
  .warn-list li.hint { color: var(--muted); }
  .dropped summary { color: var(--muted); font-size: 14px; cursor: pointer; }
  .swap-list { margin-top: 8px; }
  .proposal { border-top: 1px solid var(--line); padding: 8px 0; }
  .resync summary { color: var(--muted); font-size: 14px; cursor: pointer; margin-top: 8px; }
  .list { margin-top: 6px; }
  .plain { list-style: none; padding: 0; margin: 4px 0 12px; }
  .plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .group { margin: 12px 0; }
  .field { display: block; margin: 12px 0; }
  .field span { display: block; color: var(--muted); font-size: 14px; }
  .field input[type=number], .field input[type=time] { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-elevated); color: var(--fg); }
  .field.row input[type=checkbox] { width: 24px; height: 24px; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg-elevated); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px max(var(--gutter), env(safe-area-inset-left)) max(16px, env(safe-area-inset-bottom)); box-shadow: 0 -8px 24px rgba(0,0,0,.15); }
  .stars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .rate-item { border-top: 1px solid var(--line); padding: 8px 0 4px; }

  /* 需求單頁（T26）：很長的一頁，欄位直排；一列多欄位的（固定時段、代購、要辦的事）用 grid，窄螢幕兩欄自動換行、寬螢幕一列排開 */
  #app:has(.brief) { max-width: 820px; }
  .brief .intro { margin-bottom: 8px; }
  .brief h2 { margin-top: 24px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .brief h3 { font-size: 16px; color: var(--muted); margin: 16px 0 0; }
  .brief .hint { margin: -6px 0 8px; }
  .brief .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .brief .field select, .brief .field textarea { font: inherit; width: 100%; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-elevated); color: var(--fg); }
  .brief .field textarea { min-height: 96px; resize: vertical; line-height: 1.4; }
  .brief .field select { appearance: auto; }
  .brief .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .brief .choices { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; margin: 6px 0; }
  .brief .choice { display: inline-flex; align-items: center; gap: 6px; }
  .brief .choice input[type=checkbox], .brief .choice input[type=radio] { width: 24px; height: 24px; margin: 0; }
  .brief .choice input[type=text] { width: auto; flex: 1; min-width: 140px; padding: 6px 10px; }
  .brief .choice.other { flex: 1; }
  .brief .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .brief .btn.sm { padding: 6px 10px; font-size: 14px; }
  .brief .rows > .actions { margin-top: 8px; }
  .brief .brief-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: end; padding: 10px 0; border-top: 1px solid var(--line); }
  /* 固定時段的三個日期時間欄不能並排：Chrome 的 date／time 欄最小寬 158＋142＋142 會爆出 358（10-16 實測），窄螢幕日期占整行、開始結束並排 */
  .brief .brief-row.theme { grid-template-columns: 1.4fr 1fr auto; }
  .brief .brief-row .field { margin: 0; }
  .brief .brief-row .wide { grid-column: 1 / -1; }
  .brief .brief-row .choice { padding-bottom: 10px; }
  .brief .brief-row .del { grid-column: 1 / -1; justify-self: end; }
  .brief .brief-row.theme .del, .brief .brief-row.errand .del, .brief .brief-row.task .del { grid-column: auto; }
  .brief .person-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 24px; }
  .brief .person-head h2 { flex: 1; margin-top: 0; }
  .brief .copy-box { width: 100%; min-height: 220px; margin-top: 8px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-elevated); color: var(--fg); font: 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .brief .status .btn { margin-left: 8px; }
  /* 寬螢幕：日期／時間／日期時間欄照瀏覽器的自然寬（auto），不寫死 px——Chrome zh-TW 的 time 自然寬 138、date 154、datetime-local 242（10-16 審查量的），寫 110／210 會切到裡面的字 */
  @media (min-width: 700px) {
    .brief .brief-row.fixed { grid-template-columns: auto auto auto 1fr auto; }
    .brief .brief-row.theme { grid-template-columns: auto 1fr auto; }
    .brief .brief-row.errand { grid-template-columns: 1fr 1.3fr 80px 1.3fr auto auto; }
    .brief .brief-row.task { grid-template-columns: 1.4fr auto 1fr auto; }
    .brief .brief-row .wide, .brief .brief-row .del { grid-column: auto; }
  }

  .tabs { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tabs) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: flex; background: var(--bg-elevated); border-top: 1px solid var(--line); }
  .tab { flex: 1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: var(--muted); font-size: 15px; }
  .tab.active { color: var(--accent); font-weight: 600; }
  .banner { position: fixed; left: 0; right: 0; bottom: calc(var(--tabs) + env(safe-area-inset-bottom)); padding: 12px max(var(--gutter), env(safe-area-inset-left)); background: var(--bg-elevated); border-top: 1px solid var(--line); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
</style>
</head>
<body>
<div id="app"></div>
<!--APP-->
</body>
</html>
