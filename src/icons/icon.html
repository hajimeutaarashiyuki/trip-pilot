<!doctype html>
<!-- 圖示的來源：用 Playwright 開這頁、視窗設成 512×512 或 180×180 截圖就是 PNG（不裝任何繪圖套件）。 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100vw; height: 100vh; overflow: hidden; }
  .icon {
    width: 100vw; height: 100vh;
    background: linear-gradient(160deg, #3a8a74 0%, #2f6f5e 55%, #22513f 100%);
    display: grid; place-items: center; position: relative;
  }
  svg { width: 72%; height: 72%; }
</style>
</head>
<body>
<div class="icon">
  <!-- 一條路：起點、兩個轉折、終點旗；白線在綠底上，縮到 60px 還看得出是路線 -->
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M18 78 C 30 78, 30 48, 44 48 S 58 70, 70 56 S 76 30, 82 28" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="18" cy="78" r="8" fill="#ffffff"/>
    <circle cx="44" cy="48" r="5.5" fill="#dff2ea"/>
    <circle cx="70" cy="56" r="5.5" fill="#dff2ea"/>
    <path d="M82 28 L82 10 L96 15 L82 20" fill="#ffd166" stroke="#ffd166" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="82" cy="28" r="6" fill="#ffffff"/>
  </svg>
</div>
</body>
</html>
